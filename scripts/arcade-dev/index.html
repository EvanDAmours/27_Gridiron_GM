<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade dev</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{background:#0b0e14;height:100%;overflow:hidden}#wrap{width:100vw;height:100vh}canvas{display:block;touch-action:none;image-rendering:pixelated}</style>
</head><body><div id="wrap"><canvas id="cv"></canvas></div>
<script type="module">
  // The arcade straight from source (no build): scripts/arcade-dev/serve.mjs serves /src and /sprites.
  import { ArcadeGame } from "/src/arcade/game.js";
  import { TEAMS } from "/src/arcade/bridge.js";
  const q = new URLSearchParams(location.search), u = +(q.get("u") ?? 17), o = +(q.get("o") ?? 8);
  let seed = +(q.get("seed") || 0);
  const rand = seed ? () => ((seed = (seed * 16807) % 2147483647) / 2147483647) : undefined;
  window.game = new ArcadeGame(document.getElementById("cv"), { userTi: u, oppTi: o, teams: { user: TEAMS[u], opp: TEAMS[o] }, rand, onQuit: () => location.reload() });
</script></body></html>
