name: Sunday injury report

# Every Sunday, after the inactives for the early games are out: pull ESPN's injury report (and
# the season's results so far) into src/data/live2026.json on the game's branch, commit it, and
# redeploy, so a real player on injured reserve sits out in the game too. Scheduled runs only start
# from the default branch, so this file lives on main as well as on the game's branch.

on:
  schedule:
    - cron: "23 16 * * 0" # Sundays 16:23 UTC (about noon Eastern)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: injury-report
  cancel-in-progress: false

env:
  GAME_BRANCH: claude/scouting-overhaul

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GAME_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the injury report and results
        run: python3 scripts/fetch-nfl-results.py 2026

      - name: Check the report came through
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("src/data/live2026.json"))
          n = len(d.get("injuries") or [])
          print(f"{n} injury report entries, through week {d.get('throughWeek')}")
          sys.exit(0 if n >= 100 else 1)  # a partial pull is worse than last week's report
          EOF

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet -- src/data/live2026.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live2026.json
          git commit -m "Injury report $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GAME_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # a push made with this workflow's token doesn't start other workflows: start the deploy here
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$GAME_BRANCH" --repo "$GITHUB_REPOSITORY"
