name: Weekly results and injury report

# Pull the season's real results and ESPN's injury report into src/data/live2026.json on main,
# commit it, and redeploy. A new franchise starts in the week after the last one whose games are
# all final, so the week has to be pulled once Monday Night Football is over: Tuesday's run does
# that. Thursday's catches the injury report ahead of the weekend, and Sunday's the inactives,
# so a real player on injured reserve sits out in the game too. Scheduled runs can start hours
# late, so each one lands well clear of the games.

on:
  schedule:
    - cron: "17 11 * * 2" # Tuesdays 11:17 UTC (early morning Eastern, after Monday night's game)
    - cron: "41 14 * * 4" # Thursdays 14:41 UTC (the week's injury report)
    - cron: "23 16 * * 0" # Sundays 16:23 UTC (about noon Eastern, inactives)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: injury-report
  cancel-in-progress: false

env:
  GAME_BRANCH: main

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GAME_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the injury report and results
        run: python3 scripts/fetch-nfl-results.py 2026

      - name: Check the report came through
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("src/data/live2026.json"))
          n = len(d.get("injuries") or [])
          print(f"{n} injury report entries, through week {d.get('throughWeek')}")
          sys.exit(0 if n >= 100 else 1)  # a partial pull is worse than last week's report
          EOF

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet -- src/data/live2026.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live2026.json
          WK=$(python3 -c 'import json; print(json.load(open("src/data/live2026.json"))["throughWeek"])')
          git commit -m "Live 2026 results through week ${WK}, injury report $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GAME_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # a push made with this workflow's token doesn't start other workflows: start the deploy here
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$GAME_BRANCH" --repo "$GITHUB_REPOSITORY"
