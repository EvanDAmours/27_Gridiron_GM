name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # the built site, downloadable from the run (a branch can be tried before it is merged)
      - name: Save the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    # A full season and off-season played in a real browser, as two different clubs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        team: [Giants, Chiefs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Smoke test
        run: SMOKE_TEAM=${{ matrix.team }} npm run smoke
      # menus and rows that move under the pointer (the depth chart's spot menu, the phone's snap
      # rows) fail the release: scripts/ui-stability.mjs
      - name: UI stability
        if: matrix.team == 'Giants'
        run: npm run ui-stability
